plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'com.modrinth.minotaur' version '2.+'
}

// Jar file name: <archivesName>-<version>.jar = thevillagefightsback-1.21.1-1.3.1.jar
version = mod_version
group = mod_group_id

base {
    // Include the Minecraft version in the jar name so the 1.21.1, 1.20.1 and 1.19.2 builds never
    // collide: thevillagefightsback-1.21.1-<ver>.jar vs thevillagefightsback-1.20.1-<ver>.jar.
    // main carries the version in archivesName instead of in `version` (which this branch used to do);
    // we follow main so the two do not stack up into a doubled version in the file name.
    archivesName = "${mod_id}-${minecraft_version}"
}

// NeoForge 1.21.1 targets Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

runs {
    // applies to all the run configs below
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    // Runs all registered gametests, then exits.
    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // NeoGradle automatically adds the NeoForged maven and Maven Central.
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // (No third-party compile dependencies: guardvillagers is a runtime soft-dep referenced only by
    //  entity id, and the old JEG/framework/geckolib jars are no longer used.)
}

// Expand mod metadata placeholders into neoforge.mods.toml at build time.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

// --- Publishing to Modrinth (Minotaur) ---
// Publish with:   MODRINTH_TOKEN=xxxxxxxx ./gradlew modrinth
modrinth {
    token = providers.environmentVariable('MODRINTH_TOKEN')
    projectId = 'the-village-fights-back'
    versionNumber = "${mod_version}+neoforge-1.21.1"
    versionName = "${mod_name} ${mod_version} (NeoForge 1.21.1)"
    versionType = 'release'
    uploadFile = tasks.named('jar')
    gameVersions = ['1.21.1']
    loaders = ['neoforge']
    dependencies {
        // guardvillagers is a runtime soft-dep here (see neoforge.mods.toml). Mark optional on Modrinth.
        optional.project 'guard-villagers'
    }
}
tasks.named('modrinth').configure { dependsOn tasks.named('build') }
