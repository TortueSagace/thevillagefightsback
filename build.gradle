plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    // Include the loader and the Minecraft version in the jar name so the Fabric build never collides with the
    // Forge 1.20.1 one:  thevillagefightsback-fabric-1.20.1-<ver>.jar
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

// Mojang ships Java 17 to end users in 1.20.1, so the mod targets Java 17.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

loom {
    // One access widener, replacing the Forge branch's accesstransformer.cfg (it exposes Mob.goalSelector).
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")

    runs {
        client {
            client()
            ideConfigGenerated true
            runDir 'run'
        }
        server {
            server()
            ideConfigGenerated true
            runDir 'run'
            programArgs '--nogui'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // The whole point of this branch: the sources are written in official Mojang names, so Loom can compile them
    // as-is. Do NOT switch this to Yarn -- 44k lines would have to be renamed.
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // @Nullable and friends. Forge's dev classpath supplied JSR-305; Fabric's does not, so the annotations the
    // sources already carry come from JetBrains instead.
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // Guard Villagers is NOT on the Gradle graph, on purpose. It is a mandatory RUNTIME dependency (mod id
    // "guardvillagers", entity id "guardvillagers:guard" -- the entire compatibility surface, since the mod never
    // touches one of its classes), but Loom cannot remap it into Mojang names: its GuardEntity declares
    // setChargingCrossbow(boolean), which is also the Mojang name of the CrossbowAttackMob method it inherits, and
    // tinyremapper calls that an unfixable conflict and fails the whole remap batch.
    //
    // So `gradlew runServer` will not start (Loader enforces the depends entry). Boot-test the real jar on a real
    // Fabric dedicated server instead -- see the "Boot test" section of README-fabric.md. That tests the shipped
    // artifact rather than a dev-remapped one, which is the better check anyway.
}

processResources {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            loader_version   : loader_version,
            mod_id           : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors      : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

jar {
    from('LICENSE.txt') {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

// --- Publishing to Modrinth ---
// Minotaur is deliberately NOT applied on this branch. Whatever version of it you take drags Gson 2.9.1 onto the
// buildscript classpath, and 2.9.1 predates record support, so Loom's parse of Mojang's version manifest dies with
// "Unexpected IllegalAccessException occurred (Gson 2.9.1)" before Minecraft is ever set up. Forcing a newer Gson
// in buildscript does not win against the copy inside the plugin, so the two cannot share a build.
//
// Upload the Fabric jar by hand instead (or from the Forge branch, which still has Minotaur):
//   file:    build/libs/thevillagefightsback-fabric-1.20.1-<ver>.jar
//   project: the-village-fights-back
//   loaders: fabric        game versions: 1.20.1
//   deps:    guard-villagers-(fabricquilt) [required], fabric-api [required]
