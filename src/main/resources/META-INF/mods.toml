modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# --- Dependencies ---

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Guard Villagers is required: the village's guards (and several reflexes) are built on its guard entity.
# For the 1.19.2 build, install the 1.19.2 Guard Villagers jar (the 1.19.2 line is 1.5.x, e.g.
# guardvillagers-1.19.2-1.5.9.jar -- a different sequence than the 1.20.1 1.6.17 build). We load AFTER
# it so its guard entity is registered first.
[[dependencies.${mod_id}]]
    modId="guardvillagers"
    mandatory=true
    versionRange="[1.5,)"
    ordering="AFTER"
    side="BOTH"

# Minecraft Comes Alive (MCA Reborn) is deliberately NOT listed here. The 1.20.1 build declares it as an
# optional dependency with versionRange "[7.6,)", but 7.6 is the 1.20.1 line: the 1.19.2 line numbers
# differently, so that range would make FML REFUSE to load next to the only MCA a 1.19.2 pack can install.
# Nothing is lost by omitting it -- compat/MCACompat.java detects MCA purely at runtime, by looking its
# villager entity ids up in the registry on every call, and it needs no load-order guarantee to do that.
# See compat/MCACompat, compat/VillagerRoleTags and compat/MCATombstones.

# (Just Enough Guns + framework dependencies removed -- guns/ammo/explosions are all native now.)
