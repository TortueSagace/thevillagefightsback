modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# --- Dependencies ---

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Just Enough Guns must be present and load BEFORE us (we hook its firing API).
[[dependencies.${mod_id}]]
    modId="jeg"
    mandatory=true
    versionRange="[0.13.2,)"
    ordering="AFTER"
    side="BOTH"

# JEG's own mandatory dependency; declare it so load order is correct.
[[dependencies.${mod_id}]]
    modId="framework"
    mandatory=true
    versionRange="[0.7.0,)"
    ordering="AFTER"
    side="BOTH"
