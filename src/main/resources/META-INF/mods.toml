modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# --- Dependencies ---

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Guard Villagers is required: the village's guards (and several reflexes) are built on its guard entity.
# For the 1.19.2 build, install the 1.19.2 Guard Villagers jar. Version range is left broad because the
# 1.19.2 line uses a different version sequence than the 1.20.1 (1.6.17) build; we load AFTER it so its
# entity is registered first.
[[dependencies.${mod_id}]]
    modId="guardvillagers"
    mandatory=true
    versionRange="[1.0,)"
    ordering="AFTER"
    side="BOTH"

# (Just Enough Guns + framework dependencies removed -- guns/ammo/explosions are all native now.)
