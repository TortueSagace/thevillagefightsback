modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# --- Dependencies ---

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Guard Villagers is required: the village's guards (and several reflexes) are built on its guard entity.
# Playtested with guardvillagers-1.20.1-1.6.17.jar; we load AFTER it so its entity is registered first.
[[dependencies.${mod_id}]]
    modId="guardvillagers"
    mandatory=true
    # Any version. We never touch a Guard Villagers class -- every reference in the mod goes through the
    # "guardvillagers:guard" entity id -- so there is no API surface to be picky about, and a version floor
    # would only lock players out of a build that works fine.
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Minecraft Comes Alive (MCA Reborn) is OPTIONAL. When it is present we spawn its human villagers instead of
# vanilla ones so the village is uniformly MCA (see compat/MCACompat.java); when it is absent nothing changes.
# We load AFTER it so its villager entity types are registered before our spawn code can look them up.
[[dependencies.${mod_id}]]
    modId="mca"
    mandatory=false
    versionRange="[7.6,)"
    ordering="AFTER"
    side="BOTH"

# (Just Enough Guns + framework dependencies removed -- guns/ammo/explosions are all native now.)
