# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is left OFF: it interacts badly with some plugins (minotaur) and makes
# iterative compile-fix builds harder to reason about. Re-enable once the port is stable.
org.gradle.configuration-cache=false

# NeoForge 1.21.1 runs on Java 21. The machine default JDK is already 21, but we pin the build JVM
# here so the Gradle daemon always uses it. (Double backslashes are required in .properties files.)
org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-21.0.10.7-hotspot

# Parchment adds open community-sourced parameter names + javadocs on top of Mojang's official mappings.
# https://parchmentmc.org/docs/getting-started -- this is the release that targets 1.21.1.
neogradle.subsystems.parchment.minecraftVersion=1.21.1
neogradle.subsystems.parchment.mappingsVersion=2024.11.17


## Environment Properties

# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the NeoForge version to get a valid artifact.
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]
# The NeoForge version must agree with the Minecraft version to get a valid artifact.
neo_version=21.1.234
# The NeoForge version range used in neoforge.mods.toml.
neo_version_range=[21.1,)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=thevillagefightsback
# The human-readable display name for the mod.
mod_name=The Village Fights Back
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=1.3.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
mod_group_id=com.example.villagefightsback
# The authors of the mod. This is a simple text string that is used for display purposes in the mod list.
mod_authors=Alexandre Le Mercier
# The description of the mod. This is a simple multiline text string that is used for display purposes in the mod list.
mod_description=After years of being destroyed by your infection mods, the villagers decided it was time to build their own. This mod introduces the Village Brain Node, an advanced AI that makes the village grow and evolve over 4 stages. Playtested against the Sculk Horde, Spore Fungal Infection, The Flesh That Hates, Phayriosis, Abominations, and Prion. Contains 1 new dimension, 2 new bosses, 17 new structures, and many other surprises!
